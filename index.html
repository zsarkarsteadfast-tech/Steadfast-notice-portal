<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steadfast Update Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c1a12;--tx:#0c1a12;--mut:#587062;--g:#0fb35a;--g2:#0a8a45;--pri:#0fb35a;--dk:#0a7a45;--soft:rgba(15,179,90,.13);--chip:rgba(15,179,90,.13);--glass:rgba(255,255,255,.55);--card:rgba(255,255,255,.55);--dlg:rgba(255,255,255,.92);--fld:rgba(255,255,255,.6);--edge:rgba(255,255,255,.85);--bd:rgba(10,100,55,.14);--sh:0 10px 40px rgba(8,70,35,.13);--hi:rgba(255,255,255,.95);--b1:#eaffdc;--b2:#c9f3d8;--b3:#f4fff0;--bg:#f4fff0;--red:#d64545;--redsoft:rgba(214,69,69,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf6ee;--tx:#eaf6ee;--mut:#93aa9b;--glass:rgba(24,40,31,.55);--card:rgba(24,40,31,.55);--dlg:rgba(16,28,22,.94);--fld:rgba(255,255,255,.07);--edge:rgba(255,255,255,.14);--bd:rgba(255,255,255,.12);--sh:0 10px 40px rgba(0,0,0,.4);--hi:rgba(255,255,255,.18);--b1:#0a1a12;--b2:#0b2418;--b3:#08130d;--bg:#08130d;--chip:rgba(15,179,90,.22);--soft:rgba(15,179,90,.22);--dk:#6ee7a3;--redsoft:rgba(214,69,69,.24)}}
:root[data-theme="dark"]{--ink:#eaf6ee;--tx:#eaf6ee;--mut:#93aa9b;--glass:rgba(24,40,31,.55);--card:rgba(24,40,31,.55);--dlg:rgba(16,28,22,.94);--fld:rgba(255,255,255,.07);--edge:rgba(255,255,255,.14);--bd:rgba(255,255,255,.12);--sh:0 10px 40px rgba(0,0,0,.4);--hi:rgba(255,255,255,.18);--b1:#0a1a12;--b2:#0b2418;--b3:#08130d;--bg:#08130d;--chip:rgba(15,179,90,.22);--soft:rgba(15,179,90,.22);--dk:#6ee7a3;--redsoft:rgba(214,69,69,.24)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font:16px/1.6 Inter,"Noto Sans Bengali","Kalpurush","Nirmala UI",-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(60vw 50vh at 12% 8%,var(--b2),transparent 70%),radial-gradient(50vw 50vh at 92% 30%,rgba(15,179,90,.18),transparent 70%),linear-gradient(160deg,var(--b1),var(--b3));background-attachment:fixed;overflow-x:hidden}
html[lang="bn"] body{line-height:1.75}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
@media(min-width:900px){.wrap{max-width:94vw}}
@media(min-width:1280px){.wrap{max-width:1180px}}
@media(min-width:1600px){.wrap{max-width:1440px}}
/* glass */
.card,.fq,.lcard,.menu,.sects,.seg,.dp,.chip,.search input,.nav{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--sh),inset 0 1.5px 0 var(--hi)}
.seg,.dp,.chip,.search input{box-shadow:inset 0 1.5px 0 var(--hi)}
.menu{background:var(--dlg)}
/* header */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;padding:14px 18px 0}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;max-width:864px;margin:0 auto;padding:8px 10px 8px 18px;border-radius:999px}
@media(min-width:900px){.nav{max-width:94vw}}
@media(min-width:1280px){.nav{max-width:1180px}}
@media(min-width:1600px){.nav{max-width:1440px}}
.mid{position:relative;display:flex;justify-content:center}
.brand{display:flex;align-items:center;gap:7px}
.brand .lk{height:28px;width:auto}.brand .lw{height:15px;width:auto;margin-top:6px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lw{filter:invert(1)}}
:root[data-theme="dark"] .lw{filter:invert(1)}
.nbadge{display:inline-flex;align-items:center;gap:7px;margin-left:2px;padding:3px 9px 3px 11px;border-radius:99px;background:var(--chip);color:var(--dk);font-size:12.5px;font-weight:600;cursor:help;white-space:nowrap}
.ex{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--g2);color:#fff;font-size:11px;font-weight:800;line-height:1}
.tip{position:absolute;left:50%;top:calc(100% + 14px);transform:translate(-50%,-4px);width:min(260px,86vw);padding:9px 13px;border-radius:14px;background:rgba(12,26,18,.94);color:#fff;font-size:13px;font-weight:500;line-height:1.5;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:.15s;pointer-events:none;z-index:10}
.mid:hover .tip,.mid:focus-within .tip{opacity:1;visibility:visible;transform:translate(-50%,0)}
.menuwrap{position:relative;justify-self:end}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3fe08a,#0a8a45);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(15,179,90,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.menu{position:absolute;right:0;top:calc(100% + 14px);width:260px;border-radius:22px;padding:8px;z-index:20}
.mh{padding:8px 10px 10px;border-bottom:1px solid var(--bd);margin-bottom:6px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.mh b{font-size:13px;font-weight:600;word-break:break-all}
.mrole{background:var(--chip);color:var(--dk);font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;font-size:13.5px;color:var(--mut)}
.mout{width:100%;display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid var(--bd);color:var(--red);font-size:14px;font-weight:600;border-radius:12px;margin-top:4px}
.mout:hover{background:var(--redsoft)}
.ic{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;background:var(--chip)}
/* ticker */
.ticker{display:flex;align-items:center;gap:12px;margin-top:14px;padding:6px 8px;border-radius:999px;background:linear-gradient(90deg,#0fb35a,#16d68c);color:#fff;font-size:14px;font-weight:500;overflow:hidden;box-shadow:0 8px 24px rgba(15,179,90,.3),inset 0 1.5px 0 rgba(255,255,255,.45)}
.tk-ic{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);display:grid;place-items:center}
.tk-view{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.tk-track{display:inline-flex;white-space:nowrap;animation:tk 40s linear infinite}
.tk-view:hover .tk-track{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.tk-i{padding:0 16px}.tk-d{opacity:.7}
.tk-edit{flex:none;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:600}
/* section nav */
.sects{display:flex;gap:4px;padding:5px;border-radius:999px;margin:16px 0 0}
.sects button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--mut);transition:.2s}
.sects button:hover{color:var(--ink)}
.sects button.on,.seg button.on,.chip.on{background:var(--g);color:#fff;box-shadow:0 4px 14px rgba(15,179,90,.4),inset 0 1px 0 rgba(255,255,255,.4)}
/* headings */
.head{display:flex;align-items:center;gap:14px;margin:26px 0 18px}
.head svg.t{width:70px;height:29px;flex:none}
.head>div{flex:1;min-width:0}
h1{margin:0;font-size:clamp(26px,5vw,36px);line-height:1.1;letter-spacing:-.03em;font-weight:700}
html[lang="bn"] h1,html[lang="bn"] h2,html[lang="bn"] h3{letter-spacing:0;line-height:1.45}
.head p{margin:3px 0 0;color:var(--mut);font-size:15px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14.5px;background:var(--g);color:#fff;box-shadow:0 6px 18px rgba(15,179,90,.35),inset 0 1px 0 rgba(255,255,255,.45);white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.sm,.btn.line{background:var(--chip);color:var(--ink);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:13px;font-weight:550}
.btn.sm.danger:hover{color:var(--red)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(214,69,69,.3);padding:9px 18px;font-size:13.5px}
.ibtn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;background:var(--chip);color:var(--dk)}
.ibtn:hover{filter:brightness(.96)}
.ibtn.on{background:var(--red);color:#fff}
/* filters */
.search{position:relative}
.search input{width:100%;padding:14px 18px 14px 46px;border-radius:999px;color:var(--ink);font:inherit;font-size:15px;outline:0}
.search input:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(15,179,90,.18)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--mut);z-index:1}
.dates{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.dp{position:relative;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-size:13px;color:var(--mut);cursor:pointer}
.dv{color:var(--ink);font-size:13.5px;font-weight:550;min-width:112px}
.dp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:550;color:var(--mut)}
.chip:hover{color:var(--ink)}.chip.on:hover{color:#fff}
.chip.xr{color:var(--red)}.chip.on.xr{background:var(--red);color:#fff}
.seg{display:inline-flex;padding:4px;border-radius:999px}
.seg button{padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.al{color:var(--red);font-weight:700}
#tabs{margin-bottom:16px}
/* cards */
.card{padding:18px 22px;border-radius:26px;margin-bottom:14px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.tag{padding:3px 11px;border-radius:99px;background:var(--chip);color:var(--g2);font-weight:600;font-size:12px;white-space:nowrap}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:var(--dk)}}
:root[data-theme="dark"] .tag{color:var(--dk)}
.tag.u{background:var(--redsoft);color:var(--red)}
.tag.c{--c:#0fb35a;display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-size:13px;padding:4px 12px 4px 9px}
.tag.urgt{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 12px 4px 9px;animation:softblink 2.4s ease-in-out infinite}
@keyframes softblink{0%,100%{opacity:1}50%{opacity:.25}}
.stamp{margin-left:auto;font-size:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--red);border:2px solid var(--red);border-radius:10px;padding:2px 10px;background:var(--glass)}
html[lang="bn"] .stamp{letter-spacing:0}
.card h3{margin:4px 0 8px;font-size:23px;letter-spacing:-.4px;font-weight:700;line-height:1.3}
.card p{margin:0;color:var(--mut);font-size:15px;white-space:pre-wrap}
.card.rep{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--glass))}
.card.rep h3{color:var(--red)}
.card.exp{box-shadow:none}
.card.exp h3,.card.exp p,.card.exp .meta>span:not(.stamp){opacity:.5}
.upd{text-align:right;font-size:12.5px;color:var(--mut);margin-top:14px}.upd b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd);align-items:center;flex-wrap:wrap}
.sp{flex:1}
.note{margin-top:10px;padding:9px 12px;border-radius:14px;background:var(--redsoft);color:var(--red);font-size:13.5px;line-height:1.5}
.empty{text-align:center;color:var(--mut);padding:40px 0;grid-column:1/-1}
.fq{border-radius:24px;margin-bottom:12px}
.fq summary{cursor:pointer;list-style:none;padding:16px 22px;font-weight:650;font-size:17px;display:flex;justify-content:space-between;gap:12px}
.fq summary::-webkit-details-marker{display:none}
.fq summary:after{content:"+";font-size:24px;line-height:1;color:var(--g);transition:transform .25s}
.fq[open] summary:after{transform:rotate(45deg)}
.fq .ans{padding:0 22px 16px}.fq .ans p{margin:0;color:var(--mut);white-space:pre-wrap}
.sh{display:flex;gap:14px}.sh h3{font-size:19px;margin:0 0 4px}
.shi{flex:none;width:46px;height:46px;border-radius:15px;background:var(--chip);color:var(--dk);display:grid;place-items:center}
/* dialogs */
dialog{border:1px solid var(--edge);border-radius:28px;padding:0;width:min(480px,calc(100% - 32px));background:var(--dlg);color:var(--ink);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(8,30,18,.45)}
.dlg{padding:26px}
.dlg h2{margin:0 0 4px;font-size:21px;letter-spacing:-.4px}
html[lang="bn"] .dlg h2{letter-spacing:0}
.dlg label{display:block;font-size:12.5px;font-weight:550;color:var(--mut);margin:14px 0 5px}
.dlg input,.dlg select,.dlg textarea,#lgEmail{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:16px;background:var(--fld);color:var(--ink);font:inherit;font-size:15px;outline:0}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus,#lgEmail:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(15,179,90,.18)}
.dlg #fCn,.dlg #shCn{margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg .acts{border:0;padding:0;margin-top:22px;justify-content:flex-end}
/* login */
.login{position:fixed;inset:0;z-index:50;overflow:auto;display:flex;padding:70px 16px 24px;background:radial-gradient(60vw 50vh at 12% 8%,var(--b2),transparent 70%),radial-gradient(50vw 50vh at 92% 30%,rgba(15,179,90,.2),transparent 70%),linear-gradient(160deg,var(--b1),var(--b3))}
.lt{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:51}
.lcard{margin:auto;width:min(400px,100%);padding:34px 28px 0;border-radius:30px;text-align:center;overflow:hidden}
.lglogo{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:10px}
.lglogo .lk{height:46px;width:auto}.lglogo .lw{height:24px;width:auto;margin-top:8px}
.ltag{margin:0 0 24px;font-size:15px;font-weight:600;color:var(--dk);animation:softblink 2.6s ease-in-out infinite}
#lgEmail{margin-bottom:12px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:999px;background:var(--dlg);border:1px solid var(--edge);font-weight:600;font-size:15px;box-shadow:var(--sh)}
.gbtn:hover{border-color:var(--g)}
.lerr{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--redsoft);color:var(--red);font-size:13.5px;line-height:1.5;text-align:left}
.lfoot{margin:16px 0 0;font-size:12.5px;color:var(--mut)}
/* road */
.road{position:relative;height:66px;border-bottom:2px dashed rgba(15,179,90,.45);overflow:hidden}
.road svg{position:absolute;bottom:2px;left:0;width:104px;height:44px;animation:drive 16s linear infinite}
.road svg+svg{animation-duration:22s;animation-delay:-9s;width:84px;height:35px;opacity:.75}
@keyframes drive{from{transform:translateX(-140px)}to{transform:translateX(105vw)}}
.lcard .road{margin:20px -28px 0}
footer{margin-top:36px;text-align:center;font-size:13px;color:var(--mut);padding-bottom:30px}
footer .road{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:rgba(12,26,18,.92);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){.card h3{font-size:20px}.card{padding:16px 18px}.brand .lk{height:25px}.brand .lw{height:13px}.nbadge{font-size:11.5px;padding:2px 7px 2px 8px}.ex{width:14px;height:14px;font-size:10px}.sects button{font-size:13.5px;gap:6px}.head svg.t{width:56px;height:23px}.nav{padding-left:14px}}
@media(prefers-reduced-motion:reduce){.road svg{animation:none;left:30%}.tag.urgt,.ltag{animation:none}.tk-track{animation:none}.tk-view{overflow-x:auto}}
@media(max-width:560px){.head svg.t{display:none}.head .btn{padding:9px 16px;font-size:13.5px}}
.cal{position:fixed;z-index:70;width:300px;padding:12px;border-radius:22px;background:var(--dlg);border:1px solid var(--edge);box-shadow:0 18px 50px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}.ch b{font-size:14.5px}
.ch button{width:34px;height:34px;border-radius:50%;background:var(--chip);font-size:18px;line-height:1}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg i{font-style:normal;font-size:11.5px;color:var(--mut);padding:4px 0}
.cg button{height:36px;border-radius:50%;font-size:13.5px}
.cg button:hover{background:var(--chip)}.cg button.td{box-shadow:inset 0 0 0 1.5px var(--g)}.cg button.on{background:var(--g);color:#fff}
.cf{display:flex;justify-content:space-between;padding:8px 4px 0;border-top:1px solid var(--bd);margin-top:8px}.cf button{font-size:13px;font-weight:600;color:var(--dk);padding:4px 8px}
.ur{display:flex;align-items:center;gap:14px}
.av2{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3fe08a,#0a8a45);color:#fff;font-weight:700}
.ur h3{margin:0!important;font-size:16px!important;word-break:break-all}.ur p{margin:2px 0 0;font-size:13px}
.perm{margin-top:16px;padding:6px 14px;border-radius:18px;background:var(--fld);border:1px solid var(--bd)}
.dlg .ck{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14.5px;color:var(--ink);margin:0;font-weight:500}
.dlg .ck input{width:18px;height:18px;padding:0;accent-color:var(--g);flex:none}
.ck.all{border-bottom:1px solid var(--bd);font-weight:650}
.pls{padding-left:28px}.ck em{font-style:normal;font-size:11.5px;color:var(--dk);background:var(--chip);padding:1px 8px;border-radius:99px;margin-left:6px}
.unote{margin:14px 0 0;font-size:13.5px;color:var(--mut)}
.lerr.ok{background:var(--chip);color:var(--dk)}
@media(max-width:400px){.sects button svg{display:none}}
.home{display:flex;align-items:center;gap:7px;cursor:pointer;text-decoration:none}
.seg.wide{display:flex;margin-bottom:14px}
.seg.wide button{flex:1;padding:10px 8px;font-size:13.5px}
.gwrap{display:flex;justify-content:center;margin-bottom:6px;min-height:44px}

@media(min-width:860px){
  #list,#shList,#adList{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start}
  #list .card,#shList .card,#adList .card{margin-bottom:0}
  #faqList{column-count:2;column-gap:14px}
  #faqList .fq{break-inside:avoid;margin-bottom:12px}
}
@media(min-width:1280px){
  #list,#shList{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
  #faqList{column-count:3}
}
@media(min-width:1600px){

  var em=$("uEm").value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast(t("uBad"));return}
  var u=findU(em);if(uEditEmail===null&&u&&u.status!=="pending"){toast(t("uDup"));return}
  var role=$("uRole").value,st=$("uSt").value;if(em===me&&(role!=="admin"||st!=="active")){toast(t("uSelf"));return}
  var sids=[].slice.call(document.querySelectorAll("#pSl input")).filter(function(b){return b.checked}).map(function(b){return +b.dataset.sid});
  var perms={n:$("pN").checked?1:0,f:$("pF").checked?1:0,s:sids.length?1:0,ids:(sids.length&&sids.length===sheets.length)?"all":sids};
  if(!u){u={email:em};users.push(u)}
  u.role=role;u.status=st;u.perms=perms;delete u.req;sync("saveUser",{email:em,role:role,status:st,perms:perms});
  $("udlg").close();render();toast(t("saved"));
};

/* ---------- LIVE (Google Sheet, plain email sign-in) ---------- */
function api(action,data){
  var body=Object.assign({action:action,email:me},data||{});
  return fetch(CFG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){return r.json()})
    .then(function(d){if(d&&d.error){var e=new Error(d.error);e.code=d.code;throw e}return d})}
function sync(a,data){if(!LIVE)return;pending++;
  api(a,data).catch(function(e){if(e.code==="auth"||e.code==="denied"||e.code==="pending"){me="";return failLogin(e)}toast(t("saveFail"));refresh(true)}).then(function(){pending--})}
function applyData(d){
  notices=d.notices||[];reports=d.reports||[];faqs=d.faqs||[];sheets=d.sheets||[];ticker=d.ticker||[];police=d.police||null;
  if(d.users)users=d.users;
  notices.forEach(function(n){if(n.cat&&CK.indexOf(n.cat)<0)CK.push(n.cat)});
  sheets.forEach(function(s){if(s.cat&&SC.indexOf(s.cat)<0)SC.push(s.cat)});
  tkKey=""}
function enter(d,email){
  applyData(d);var u=d.user;me=email;role=u.role;curU=u;edName=u.name||nameOf(me);
  try{sessionStorage.setItem("email",me)}catch(e){}
  section="notice";view="notices";grp="cs";cat="all";faqCat="all";policeOpen=false;
  $("lgErr").className="lerr hide";$("login").className="login hide";$("app").className="";ui();window.scrollTo(0,0)}
function failLogin(e,email){
  me="";try{sessionStorage.removeItem("email")}catch(x){}
  var k=e&&e.code==="pending"?"lgPend":e&&e.code==="denied"?"lgDeny":e&&e.code==="auth"?"lgExp":"lgFail";
  if(email)$("lgEmail").value=email;
  showLg(k,k==="lgPend");$("app").className="hide";$("login").className="login"}
function boot(email){me=email;api("load").then(function(d){enter(d,email)}).catch(function(e){failLogin(e,email)})}
function refresh(force){
  if(!LIVE||!me||(pending>0&&!force)||document.querySelector("dialog[open]"))return;
  api("load").then(function(d){applyData(d);if(d.user){role=d.user.role;curU=d.user;edName=d.user.name||edName}render()})
    .catch(function(e){if(e.code==="auth"||e.code==="denied"||e.code==="pending")failLogin(e,me)})}
if(LIVE){
  var savedEmail=null;try{savedEmail=sessionStorage.getItem("email")}catch(e){}
  if(savedEmail)boot(savedEmail);
  setInterval(function(){if(!document.hidden)refresh(false)},60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh(false)});
}
